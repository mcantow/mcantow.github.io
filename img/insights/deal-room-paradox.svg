<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f4"/>
    </linearGradient>
    <!-- Drop shadow filter for the elevated panel -->
    <filter id="panelElevation" x="-8%" y="0%" width="108%" height="100%">
      <feDropShadow dx="-8" dy="0" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="flywheelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="628" fill="url(#bg)"/>
  <!-- Elevated white panel — slides in from the right, drop shadow on left edge -->
  <rect x="730" y="0" width="470" height="628" fill="#fdfbff" filter="url(#panelElevation)"/>

  <!-- Content shifted down 24px to center in 628px canvas
       Content spans y=122..542 = 420px. Canvas 628px. Offset = (628-420)/2 - 122 = -18px
       Actually: center of content = (122+542)/2 = 332. Center of canvas = 314.
       Shift = 314-332 = -18px (shift UP 18px). But original was designed for 580,
       so content is already nearly centered. Just shift down slightly: +24px -->
  <g transform="translate(0,24)">

  <!-- ── LEFT — the problem ──────────────────────────────────────── -->

  <!-- $1B: baseline y=252, cap top ~y=122 -->
  <text x="60" y="252"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="180" font-weight="800" fill="#111827" letter-spacing="-5">$1B</text>

  <!-- Rule: y=296 — 44px below $1B baseline, 44px above $25M cap top. -->
  <line x1="60" y1="296" x2="698" y2="296" stroke="#111827" stroke-width="1.5"/>

  <!-- $25M: cap top y=341 (44px below rule), baseline y=406 -->
  <text x="60" y="406"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" fill="#DC2626" letter-spacing="-3">$25M</text>


  <!-- ── RIGHT — the solution ────────────────────────────────────
       Flywheel center: (950, 264)
       ─────────────────────────────────────────────────────────── -->

  <!-- Flywheel: center (950,264) r=142 -->

  <!-- Ambient glow -->
  <circle cx="950" cy="264" r="195" fill="url(#flywheelGlow)"/>
  <circle cx="950" cy="264" r="155" fill="url(#flywheelGlow)"/>

  <!-- Outer halo -->
  <circle cx="950" cy="264" r="175" fill="none" stroke="#a5b4fc" stroke-width="0.8" opacity="0.10"/>

  <!-- Main ring -->
  <circle cx="950" cy="264" r="142" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.35"/>

  <!-- Inner ring -->
  <circle cx="950" cy="264" r="69"  fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.15"/>

  <!-- Spokes -->
  <g opacity="0.10">
    <line x1="950" y1="264" x2="950"  y2="134" stroke="#818cf8" stroke-width="1"/>
    <line x1="950" y1="264" x2="1075" y2="225" stroke="#818cf8" stroke-width="1"/>
    <line x1="950" y1="264" x2="1027" y2="372" stroke="#818cf8" stroke-width="1"/>
    <line x1="950" y1="264" x2="874"  y2="372" stroke="#818cf8" stroke-width="1"/>
    <line x1="950" y1="264" x2="825"  y2="225" stroke="#818cf8" stroke-width="1"/>
  </g>

  <!-- Arc 1→2 -->
  <path d="M975,124 A142,142 0 0,1 1075,198" fill="none" stroke="#6366f1" stroke-width="2.8" opacity="0.60"/>
  <polygon points="1075,198 1066,190 1074,185" fill="#6366f1" opacity="0.60"/>

  <!-- Arc 2→3 -->
  <path d="M1091,244 A142,142 0 0,1 1052,362" fill="none" stroke="#6366f1" stroke-width="2.8" opacity="0.55"/>
  <polygon points="1052,362 1057,350 1064,358" fill="#6366f1" opacity="0.55"/>

  <!-- Arc 3→4 -->
  <path d="M1013,392 A142,142 0 0,1 887,392" fill="none" stroke="#6366f1" stroke-width="2.8" opacity="0.55"/>
  <polygon points="887,392 900,393 896,401" fill="#6366f1" opacity="0.55"/>

  <!-- Arc 4→5 -->
  <path d="M848,362 A142,142 0 0,1 809,244" fill="none" stroke="#6366f1" stroke-width="2.8" opacity="0.50"/>
  <polygon points="809,244 813,257 803,255" fill="#6366f1" opacity="0.50"/>

  <!-- Arc 5→1 -->
  <path d="M825,198 A142,142 0 0,1 925,124" fill="none" stroke="#6366f1" stroke-width="2.8" opacity="0.50"/>
  <polygon points="925,124 915,132 912,122" fill="#6366f1" opacity="0.50"/>

  <!-- Node 1 — top -->
  <circle cx="950"  cy="122" r="28" fill="#6366f1" opacity="0.10"/>
  <circle cx="950"  cy="122" r="18" fill="#6366f1" opacity="0.70"/>
  <circle cx="950"  cy="122" r="8"  fill="#a5b4fc" opacity="0.90"/>

  <!-- Node 2 — upper-right -->
  <circle cx="1085" cy="220" r="28" fill="#6366f1" opacity="0.10"/>
  <circle cx="1085" cy="220" r="18" fill="#6366f1" opacity="0.65"/>
  <circle cx="1085" cy="220" r="8"  fill="#a5b4fc" opacity="0.85"/>

  <!-- Node 3 — lower-right -->
  <circle cx="1034" cy="379" r="28" fill="#6366f1" opacity="0.10"/>
  <circle cx="1034" cy="379" r="18" fill="#6366f1" opacity="0.65"/>
  <circle cx="1034" cy="379" r="8"  fill="#a5b4fc" opacity="0.85"/>

  <!-- Node 4 — lower-left -->
  <circle cx="867"  cy="379" r="28" fill="#6366f1" opacity="0.10"/>
  <circle cx="867"  cy="379" r="18" fill="#6366f1" opacity="0.65"/>
  <circle cx="867"  cy="379" r="8"  fill="#a5b4fc" opacity="0.85"/>

  <!-- Node 5 — upper-left -->
  <circle cx="815"  cy="220" r="28" fill="#6366f1" opacity="0.10"/>
  <circle cx="815"  cy="220" r="18" fill="#6366f1" opacity="0.65"/>
  <circle cx="815"  cy="220" r="8"  fill="#a5b4fc" opacity="0.85"/>

  <!-- Center core -->
  <circle cx="950" cy="264" r="33" fill="#6366f1" opacity="0.06"/>
  <circle cx="950" cy="264" r="21" fill="#6366f1" opacity="0.12"/>
  <circle cx="950" cy="264" r="12" fill="#6366f1" opacity="0.30"/>
  <circle cx="950" cy="264" r="6"  fill="#818cf8" opacity="0.70"/>
  <circle cx="950" cy="264" r="2"  fill="#c7d2fe" opacity="0.90"/>


  <!-- ── PILLS ─────── -->
  <rect x="60" y="468" width="144" height="52" rx="26" fill="#E5E7EB"/>
  <text x="132" y="500" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="500" fill="#374151">One Decade</text>

  <rect x="218" y="468" width="160" height="52" rx="26" fill="#E5E7EB"/>
  <text x="298" y="500" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="500" fill="#374151">Twelve Teams</text>

  <rect x="392" y="468" width="306" height="52" rx="26" fill="#FEE2E2"/>
  <text x="545" y="500" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="700" fill="#DC2626">2.5% Annual Return on Capital</text>

  <!-- New Category pill — centered under the flywheel -->
  <rect x="850" y="468" width="200" height="52" rx="26" fill="#ede9fe"/>
  <text x="950" y="500" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="700" fill="#6366f1">New Category</text>

  </g>
</svg>
