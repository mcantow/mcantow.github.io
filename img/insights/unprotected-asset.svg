<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <!--
    Patent cascade (original) — the portfolio as a monument.
    A big, crisp front filing (ghost paragraphs + FIG plate) over a
    clean cascade of sheets stepping up and back. Premium, uncluttered.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#eef0f6"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="sheet" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#2a2a55" flood-opacity="0.14"/>
    </filter>  </defs>

  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#halo)"/>

  <!-- soft ground shadow at the base of the front filing -->
  <ellipse cx="600" cy="606" rx="244" ry="20" fill="#1a1a3a" opacity="0.07"/>

  <!-- ===== REAR SHEETS (back -> front): smaller, higher, fainter ===== -->

  <!-- apex -->
  <g opacity="0.34">
    <rect x="525" y="40" width="150" height="200" rx="9" fill="#ffffff" stroke="#cfcde8" stroke-width="1.2" filter="url(#sheet)"/>
    <rect x="543" y="58" width="74" height="8" rx="3" fill="#c4c2dc"/>
    <rect x="543" y="74" width="52" height="6" rx="3" fill="#d8d6ea"/>  </g>
  <g opacity="0.5">
    <rect x="503" y="78" width="194" height="260" rx="10" fill="#ffffff" stroke="#cdcbe6" stroke-width="1.3" filter="url(#sheet)"/>
    <rect x="525" y="98" width="96" height="9" rx="3.5" fill="#bfbdda"/>
    <rect x="525" y="116" width="68" height="6" rx="3" fill="#d6d4e8"/>  </g>
  <g opacity="0.66">
    <rect x="477" y="116" width="246" height="320" rx="11" fill="#ffffff" stroke="#cbc9e4" stroke-width="1.4" filter="url(#sheet)"/>
    <rect x="503" y="138" width="120" height="10" rx="4" fill="#bbb9d8"/>
    <rect x="503" y="158" width="86" height="7" rx="3" fill="#d4d2e6"/>  </g>
  <g opacity="0.84">
    <rect x="447" y="152" width="306" height="380" rx="12" fill="#ffffff" stroke="#c7c5e2" stroke-width="1.5" filter="url(#sheet)"/>
    <rect x="476" y="176" width="150" height="11" rx="4.5" fill="#b6b4d4"/>
    <rect x="476" y="198" width="104" height="7" rx="3.5" fill="#d2d0e4"/>  </g>

  <!-- ===== FRONT FILING: fully drawn ===== -->
  <g>
    <rect x="408" y="190" width="384" height="412" rx="14" fill="#ffffff" stroke="#bdbbdd" stroke-width="1.6" filter="url(#sheet)"/>

    <!-- title block -->
    <rect x="444" y="222" width="210" height="14" rx="5" fill="#9c9ac6"/>
    <rect x="444" y="246" width="150" height="9" rx="4" fill="#cbc9e2"/>

    <!-- skeleton paragraph -->
    <g fill="#dedce9">
      <rect x="444" y="296" width="150" height="7" rx="3.5"/>
      <rect x="444" y="312" width="168" height="7" rx="3.5"/>
      <rect x="444" y="328" width="134" height="7" rx="3.5"/>
      <rect x="444" y="344" width="160" height="7" rx="3.5"/>
      <rect x="444" y="360" width="96"  height="7" rx="3.5"/>
    </g>

    <!-- FIG plate -->
    <rect x="444" y="392" width="304" height="166" rx="8" fill="#f6f6fb" stroke="#dcdaee" stroke-width="1.2"/>
    <text x="452" y="410" fill="#b4b2d2" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">FIG. 1</text>
    <!-- the CustomerNode journey: stages on a circular flow -->
    <g>
      <!-- orbital ring -->
      <circle cx="596" cy="486" r="50" fill="none" stroke="#a9a7d0" stroke-width="1.2" opacity="0.5"/>
      <!-- hub -->
      <circle cx="596" cy="486" r="3.2" fill="#bdbbdd"/>
      <!-- six stage cards around the ring -->
      <g stroke="#a9a7d0" stroke-width="1.3">
        <g fill="#c7d2fe"><rect x="581" y="429" width="30" height="14" rx="3"/></g>
        <g fill="#ffffff">
          <rect x="624" y="454" width="30" height="14" rx="3"/>
          <rect x="624" y="504" width="30" height="14" rx="3"/>
          <rect x="581" y="529" width="30" height="14" rx="3"/>
          <rect x="538" y="504" width="30" height="14" rx="3"/>
          <rect x="538" y="454" width="30" height="14" rx="3"/>
        </g>
      </g>
      <!-- faint stage-name ticks inside the cards -->
      <g fill="#cbc9e2">
        <rect x="630" y="460" width="18" height="2.4" rx="1.2"/>
        <rect x="630" y="510" width="18" height="2.4" rx="1.2"/>
        <rect x="587" y="535" width="18" height="2.4" rx="1.2"/>
        <rect x="544" y="510" width="18" height="2.4" rx="1.2"/>
        <rect x="544" y="460" width="18" height="2.4" rx="1.2"/>
      </g>
      <!-- current-stage check above the active (top) card -->
      <path d="M592,422 l3,3 l5,-6" fill="none" stroke="#8b89c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>  </g>
</svg>
